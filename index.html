<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سماء العنابي - الواقع المعزز المشترك</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #camera-stream { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px; }
        .tracking-status { background: rgba(0,0,0,0.6); color: #fff; padding: 5px 15px; border-radius: 20px; font-size: 14px; pointer-events: auto; border: 1px solid #555; backdrop-filter: blur(5px); }
        .status-dot { color: #00ff00; text-shadow: 0 0 5px #00ff00; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .logo-container img { height: 90px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6)); pointer-events: auto; }
        
        .bottom-bar { padding: 15px; padding-bottom: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; pointer-events: auto; }
        .action-btn { background: linear-gradient(135deg, #6c102a, #4a0b1d); border: 1.5px solid #d4af37; border-radius: 12px; color: #fff; padding: 12px 5px; font-size: 13px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6); cursor: pointer; transition: transform 0.2s; }
        .action-btn:active { transform: scale(0.95); }
        .btn-icon { font-size: 22px; margin-bottom: 5px; }
        
        /* نوافذ وإشعارات */
        #payment-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 20px; border-radius: 15px; z-index: 10; width: 85%; max-width: 350px; text-align: center; pointer-events: auto; direction: rtl; box-shadow: 0 20px 40px rgba(0,0,0,0.9); }
        #payment-modal input { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 15px; outline: none; }
        #payment-modal input:focus { border-color: #6c102a; }
        #payment-modal button { background: linear-gradient(135deg, #6c102a, #4a0b1d); color: #d4af37; border: 1px solid #d4af37; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; }
        
        #broadcast-toast { display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); border: 1px solid #d4af37; color: #fff; padding: 10px 20px; border-radius: 30px; z-index: 20; font-size: 14px; font-weight: bold; text-shadow: 0 0 5px #000; text-align: center; width: 85%; backdrop-filter: blur(5px); }
        .toast-icon { color: #00ff00; margin-left: 5px; animation: blink 1s infinite; }

        /* طبقة الواقع المعزز (المحاكاة البصرية) */
        #ar-effect-layer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; flex-direction: column; justify-content: center; align-items: center; background: transparent; }
        
        /* تأثيرات الحركة للعناصر البصرية */
        .ar-item { 
            width: 80%; 
            max-width: 350px; 
            opacity: 0; 
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
        }
        
        /* حركة سينمائية مذهلة للصورة */
        .cinematic-animation {
            animation: swoopInAndOut 8.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* حركة نص الاسم */
        #ar-text { 
            color: #d4af37; 
            text-shadow: 0 0 15px #6c102a, 0 0 30px #6c102a, 0 0 45px #000; 
            font-size: 3.5rem; 
            text-align: center; 
            font-weight: bold; 
            z-index: 6; 
            margin-top: 15px; 
            opacity: 0;
            animation: textEntrance 8.5s ease-in-out forwards;
        }

        /* مفاتيح الحركة (Keyframes) للإبهار البصري */
        @keyframes swoopInAndOut {
            0% { transform: scale(0) translateY(200px); opacity: 0; } /* يبدأ صغيراً جداً من أسفل */
            15% { transform: scale(1.1) translateY(-20px); opacity: 1; filter: brightness(1.5); } /* يكبر ويندفع بقوة */
            25% { transform: scale(1) translateY(0); opacity: 1; } /* يستقر في المنتصف */
            75% { transform: scale(1.05) translateY(0); opacity: 1; } /* يطفو بهدوء لعدة ثوانٍ */
            90% { transform: scale(1.5) translateY(-50px); opacity: 0.8; } /* يبدأ في التضخم للرحيل */
            100% { transform: scale(3) translateY(-150px); opacity: 0; } /* يتلاشى كأنه مر فوق الكاميرا */
        }

        @keyframes textEntrance {
            0% { transform: scale(0); opacity: 0; }
            20% { transform: scale(1.2); opacity: 1; }
            30% { transform: scale(1); opacity: 1; }
            75% { transform: scale(1); opacity: 1; text-shadow: 0 0 25px #d4af37, 0 0 45px #6c102a; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <video id="camera-stream" autoplay playsinline></video>
    
    <div id="broadcast-toast"><span class="toast-icon">●</span> يتم الآن بث عرضك لجميع الهواتف في المنطقة...</div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="logo-container"><img src="image_7e53dc.png" alt="شعار اليوم الوطني"></div>
            <div class="tracking-status">متصل بالشبكة الجغرافية <span class="status-dot">●</span></div>
        </div>
        
        <div class="bottom-bar">
            <div class="action-btn" onclick="openModal('ألعاب نارية باسم عائلتك', 'fireworks')">
                <span class="btn-icon">🎇</span> ألعاب نارية
            </div>
            <div class="action-btn" onclick="openModal('أطلق صقراً باسمك', 'falcon')">
                <span class="btn-icon">🦅</span> إطلاق صقر
            </div>
            <div class="action-btn" onclick="openModal('شعار اليوم الوطني مع اسمك', 'logo')">
                <span class="btn-icon">🏅</span> الشعار الرسمي
            </div>
            <div class="action-btn" onclick="openModal('علم قطر مع تهنئة', 'flag')">
                <span class="btn-icon">🇶🇦</span> علم قطر
            </div>
        </div>
    </div>

    <div id="payment-modal">
        <h3 id="modal-title" style="color: #6c102a;">تأكيد العرض المشترك</h3>
        <p style="font-size: 13px; color: #555;">سيظهر هذا العرض لجميع الحاضرين في موقعك اللحظي</p>
        <input type="text" id="user-name" placeholder="اكتب الاسم أو التهنئة للجمهور...">
        <button onclick="launchGlobalAR()">🚀 ادفع وأطلق في سماء الجميع</button>
    </div>

    <div id="ar-effect-layer">
        <!-- أزلنا الكلاسات القديمة وأضفنا كلاس الحركة السينمائية -->
        <img id="ar-img-effect" class="ar-item" src="" alt="تأثير بصري">
        <h2 id="ar-text"></h2>
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => video.srcObject = stream);
        }

        let currentEffectType = '';

        function openModal(title, type) {
            document.getElementById('modal-title').innerText = title;
            currentEffectType = type;
            document.getElementById('payment-modal').style.display = 'block';
        }

        function launchGlobalAR() {
            const name = document.getElementById('user-name').value;
            if(name.trim() === "") { alert("يرجى كتابة الاسم أولاً!"); return; }
            
            document.getElementById('payment-modal').style.display = 'none';
            
            // إظهار إشعار البث للجميع
            const toast = document.getElementById('broadcast-toast');
            toast.style.display = 'block';
            
            const effectLayer = document.getElementById('ar-effect-layer');
            const imgEffect = document.getElementById('ar-img-effect');
            
            // إعادة ضبط الحركة (لضمان عملها كل مرة نضغط فيها)
            imgEffect.classList.remove('cinematic-animation');
            document.getElementById('ar-text').style.animation = 'none';
            void imgEffect.offsetWidth; // Trigger Reflow
            
            // الروابط الجديدة للصور المفرغة (Stickers) لضمان عدم وجود خلفية
            if(currentEffectType === 'fireworks') {
                imgEffect.src = 'https://media.giphy.com/media/26tOZ42Mg6pbTUPHW/giphy.gif';
                imgEffect.style.width = '120%'; // الألعاب النارية تحتاج مساحة أكبر
            } else if (currentEffectType === 'falcon') {
                imgEffect.src = 'https://media.giphy.com/media/3o7TKo4JmP50Y932WQ/giphy.gif'; // صقر مفرغ تماماً
                imgEffect.style.width = '80%';
            } else if (currentEffectType === 'logo') {
                imgEffect.src = 'image_7e53dc.png'; 
                imgEffect.style.width = '60%';
            } else if (currentEffectType === 'flag') {
                imgEffect.src = 'https://upload.wikimedia.org/wikipedia/commons/6/65/Flag_of_Qatar.svg';
                imgEffect.style.width = '70%';
            }

            // تطبيق كلاس الحركة
            imgEffect.classList.add('cinematic-animation');
            document.getElementById('ar-text').style.animation = 'textEntrance 8.5s ease-in-out forwards';
            
            document.getElementById('ar-text').innerText = name;
            effectLayer.style.display = 'flex';
            
            // إنهاء العرض بعد 8.5 ثوانٍ بدلاً من 7 لزيادة الاستمتاع
            setTimeout(() => {
                effectLayer.style.display = 'none';
                toast.style.display = 'none';
                document.getElementById('user-name').value = '';
            }, 8500);
        }
    </script>
</body>
</html>
