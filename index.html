<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>سماء العنابي - محرك الـ GPS</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex-location-only.js'></script>
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js'></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- تم إضافة أبعاد إجبارية للكاميرا لتحسين الدقة ومنع التمدد -->
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; sourceWidth:1280; sourceHeight:960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;"
    >
      <!-- تم إضافة fov="80" لتوسيع زاوية الكاميرا وإلغاء الزووم -->
      <a-camera gps-camera rotation-reader fov="80"></a-camera>

      <!-- المكعب التجريبي على إحداثياتك -->
      <a-box 
        gps-entity-place="latitude: 25.2127517; longitude: 51.4679630;" 
        color="#6c102a" 
        scale="2 2 2"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
      </a-box>
      
    </a-scene>
  </body>
</html>
